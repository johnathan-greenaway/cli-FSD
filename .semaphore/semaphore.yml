version: v1.0
name: Python
agent:
  machine:
    type: e2-standard-2
    os_image: ubuntu2204
blocks:
  - name: Test and Deploy
    task:
      secrets: 
        - name: TWINE_PASSWORD
      jobs:
        - name: pytest
          commands:
            - sem-version python 3.11
            - checkout
            - python -m pip install --upgrade pip
            - pip install -r requirements.txt
            - pip install flake8
            - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            - flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
            - pip install pytest
            # - pytest --no-tests-exit-0
            
            # Extract base version from version module
            - export BASE_VERSION=$(python -c "import version; print(version.__version__)")
            - echo "Base version is $BASE_VERSION"
            
            # Handle release branch (standard version)
            - |
              if [[ "${SEMAPHORE_GIT_BRANCH}" == "release-branch" ]]; then
                echo "On release branch - using version $BASE_VERSION"
                # Update version in setup.py
                sed -i "s/version=[\"'][^\"']*[\"']/version=\"$BASE_VERSION\"/" setup.py
                pip install twine build
                python -m build
                TWINE_USERNAME=__token__ TWINE_PASSWORD=${TWINE_PASSWORD} python -m twine upload --verbose dist/*
              fi
            
            # Handle development branch (.dev1 suffix)
            - |
              if [[ "${SEMAPHORE_GIT_BRANCH}" == "development" ]]; then
                DEV_VERSION="${BASE_VERSION}.dev1"
                echo "On development branch - using version $DEV_VERSION"
                # Update version in setup.py
                sed -i "s/version=[\"'][^\"']*[\"']/version=\"$DEV_VERSION\"/" setup.py
                pip install twine build
                python -m build
                TWINE_USERNAME=__token__ TWINE_PASSWORD=${TWINE_PASSWORD} python -m twine upload --verbose --skip-existing dist/*
              fi
            
            # Handle feature branches (.dev0+feature.name suffix)
            - |
              if [[ "${SEMAPHORE_GIT_BRANCH}" =~ ^feature/ ]]; then
                FEATURE_NAME=$(echo ${SEMAPHORE_GIT_BRANCH} | sed "s/feature\///" | sed "s/[-\/]/./"g)
                DEV_VERSION="${BASE_VERSION}.dev0+feature.${FEATURE_NAME}"
                echo "On feature branch - using version $DEV_VERSION"
                # Update version in setup.py
                sed -i "s/version=[\"'][^\"']*[\"']/version=\"$DEV_VERSION\"/" setup.py
                pip install twine build
                python -m build
                TWINE_USERNAME=__token__ TWINE_PASSWORD=${TWINE_PASSWORD} python -m twine upload --verbose --skip-existing dist/*
              fi